:root{

  --accent:#2fd2ff; --accent2:#ff8a3d; --ok:#3ee98a; --bad:#ff4d5e;
  --text:#d7e3f0; --muted:#6f8095;

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}

main{flex:1;display:flex;min-height:0}

aside{width:var(--aside-w);flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px}
aside section{margin-bottom:16px}
aside h2{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input[type=text]{font-family:var(--mono);font-size:.72rem;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
button{cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#02131c;font-weight:600}
button.playing{background:var(--accent2);border-color:var(--accent2);color:#20100a;font-weight:600}
button:disabled{opacity:.38;cursor:not-allowed}
select,input[type=text]{width:100%}
.icon-btn{padding:6px 9px;width:auto}
.info{font-family:var(--mono);font-size:.66rem;line-height:1.65;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 10px}
.info b{color:var(--text);font-weight:500}
.utc{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:6px}
.utc b{color:var(--accent2);font-weight:500}
.slider{display:flex;align-items:center;gap:8px;margin-top:8px}
.slider input{flex:1;accent-color:var(--accent)}
.slider span{font-family:var(--mono);font-size:.64rem;color:var(--accent);min-width:36px;text-align:right}
.note{font-family:var(--mono);font-size:.6rem;line-height:1.5;color:var(--accent2);margin-top:7px;min-height:1em}
.legend-img-wrap{margin-top:8px;display:none;background:#dfe7ee;border-radius:5px;padding:6px;max-height:150px;overflow:auto}
.legend-img-wrap img{display:block;width:100%;height:auto}
.check{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.66rem;color:var(--text);margin-top:8px;cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);margin:0}
.proxy-row{display:flex;gap:6px;margin-top:6px}
.proxy-row input{flex:1}
.proxy-row button{width:auto;white-space:nowrap}
.proxy-st{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:5px;line-height:1.5}
.proxy-st.ok{color:var(--ok)}
.proxy-st.bad{color:var(--bad)}
.radars{font-family:var(--mono);font-size:.66rem;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;max-height:170px;overflow-y:auto;color:var(--muted)}
.radars label{display:flex;align-items:center;gap:6px;padding:2.5px 0;cursor:pointer;white-space:nowrap}
.radars input{accent-color:var(--accent);margin:0;flex:none}
.radars .nm{color:var(--text);overflow:hidden;text-overflow:ellipsis}
